name: Trae Credit Monitor
on:
  schedule:
    # 北京时间早上8点（UTC 0点）
    - cron: "0 0 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: trae-monitor
  cancel-in-progress: true
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # =====调试步骤，只打印长度，不会泄露账号=====
      - name: Debug TRAE_ACCOUNTS Length
        run: echo "TRAE_ACCOUNTS length = ${#TRAE_ACCOUNTS}"
        env:
          TRAE_ACCOUNTS: ${{ secrets.TRAE_ACCOUNTS }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run credit monitor
        env:
          TRAE_ACCOUNTS: ${{ secrets.TRAE_ACCOUNTS }}
          QYWX_TOKEN: ${{ secrets.QYWX_TOKEN }}
        run: python trae_credit_monitor.py
